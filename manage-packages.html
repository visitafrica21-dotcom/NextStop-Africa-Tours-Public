<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manage Packages — NextStop Africa</title>
<style>
  body {
    font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
    background: #FAFAF7;
    color: #2a2421;
    max-width: 640px;
    margin: 0 auto;
    padding: 28px 20px 60px;
    line-height: 1.6;
  }
  h1 { font-size: 22px; margin-bottom: 4px; }
  .sub { color: #888; font-size: 13px; margin-bottom: 24px; }
  .group-label {
    font-size: 13px;
    font-weight: 700;
    color: #C84B31;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin: 24px 0 10px;
  }
  .card {
    background: #fff;
    border: 1px solid rgba(0,0,0,0.08);
    border-radius: 14px;
    padding: 16px 18px;
    margin-bottom: 10px;
    display: flex;
    gap: 14px;
    align-items: center;
  }
  .card.dup {
    border-color: #C84B31;
    background: #fff6f4;
  }
  .card img, .card .noimg {
    width: 64px;
    height: 64px;
    border-radius: 10px;
    object-fit: cover;
    flex-shrink: 0;
    background: #2a2421;
  }
  .card-info { flex: 1; min-width: 0; }
  .card-info h3 {
    font-size: 14px;
    margin: 0 0 2px;
    line-height: 1.3;
  }
  .card-info .meta {
    font-size: 11px;
    color: #999;
  }
  .dup-tag {
    display: inline-block;
    background: #C84B31;
    color: #fff;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    padding: 2px 7px;
    border-radius: 10px;
    margin-left: 6px;
    vertical-align: middle;
  }
  .del-btn {
    flex-shrink: 0;
    background: #fdecea;
    color: #b3261e;
    border: none;
    border-radius: 20px;
    padding: 9px 14px;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    cursor: pointer;
  }
  .del-btn:hover { background: #f8d3ce; }
  .del-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  #status {
    margin: 20px 0;
    padding: 14px 16px;
    border-radius: 12px;
    font-size: 13px;
    display: none;
  }
  #status.success { display: block; background: #e9f7ef; color: #1a7a3f; }
  #status.error { display: block; background: #fdecea; color: #b3261e; }
  #empty { color: #999; font-size: 14px; text-align: center; padding: 40px 0; }
  .refresh-btn {
    width: 100%;
    padding: 12px;
    border-radius: 50px;
    border: 1px solid rgba(0,0,0,0.15);
    background: #fff;
    color: #2a2421;
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    cursor: pointer;
    margin-bottom: 20px;
  }
</style>
</head>
<body>

  <h1>Manage Packages</h1>
  <p class="sub">Every package currently live on your site, grouped by country. Packages with the same country + name are flagged as possible duplicates so they're easy to spot.</p>

  <button class="refresh-btn" id="refresh-btn">Refresh List</button>

  <div id="status"></div>
  <div id="list">Loading…</div>

  <script src="itinerary-utils.js"></script>
  <script>
    const utils = window.ItineraryUtils;

    function keyOf(country, packageName) {
      return (country + '::' + packageName).toLowerCase();
    }

    function setStatus(kind, html) {
      const el = document.getElementById('status');
      el.className = kind;
      el.style.display = 'block';
      el.innerHTML = html;
      setTimeout(() => { el.style.display = 'none'; }, 5000);
    }

    async function loadList() {
      const listEl = document.getElementById('list');
      listEl.innerHTML = 'Loading…';

      await utils.initItineraries();
      const items = utils.sortItineraries(
        utils.ensurePackageNumbers(utils.getBrochurePackages(await utils.getAllItinerariesAsync()))
      );

      if (items.length === 0) {
        listEl.innerHTML = '<div id="empty">No packages found.</div>';
        return;
      }

      // Count how many share the same country + package name
      const counts = {};
      items.forEach((it) => {
        const k = keyOf(it.country, it.packageName);
        counts[k] = (counts[k] || 0) + 1;
      });

      // Group by country for display
      const byCountry = {};
      items.forEach((it) => {
        if (!byCountry[it.country]) byCountry[it.country] = [];
        byCountry[it.country].push(it);
      });

      let html = '';
      Object.keys(byCountry).forEach((country) => {
        html += '<div class="group-label">' + utils.escapeHtml(country) + '</div>';
        byCountry[country].forEach((it) => {
          const isDup = counts[keyOf(it.country, it.packageName)] > 1;
          const imgHtml = it.image
            ? '<img src="' + it.image + '" alt="">'
            : '<div class="noimg"></div>';
          const dateStr = it.timestamp ? new Date(it.timestamp).toLocaleDateString() : '';
          html += '<div class="card' + (isDup ? ' dup' : '') + '" data-id="' + it.id + '">' +
            imgHtml +
            '<div class="card-info">' +
              '<h3>' + utils.escapeHtml(it.packageName) + (isDup ? '<span class="dup-tag">Duplicate</span>' : '') + '</h3>' +
              '<div class="meta">' + utils.escapeHtml(it.nights) + 'N/' + utils.escapeHtml(it.days) + 'D' + (dateStr ? ' &middot; added ' + dateStr : '') + '</div>' +
            '</div>' +
            '<button type="button" class="del-btn" data-id="' + it.id + '">Delete</button>' +
          '</div>';
        });
      });

      listEl.innerHTML = html;

      listEl.querySelectorAll('.del-btn').forEach((btn) => {
        btn.addEventListener('click', () => deletePackage(btn.dataset.id, btn));
      });
    }

    async function deletePackage(id, btn) {
      let items = await utils.getAllItinerariesAsync();
      const target = items.find((it) => it.id === id);
      if (!target) return;

      const label = utils.formatPackageLabel(target);
      if (!confirm('Delete "' + label + '" from the brochure? This cannot be undone.')) return;

      btn.disabled = true;
      btn.textContent = 'Deleting…';

      try {
        items = items.filter((it) => it.id !== id);
        items = utils.ensurePackageNumbers(items);
        await utils.saveItinerariesAsync(items);
        setStatus('success', '&#10004; "' + label + '" deleted.');
        await loadList();
      } catch (err) {
        console.error(err);
        setStatus('error', 'Could not delete: ' + (err && err.message ? err.message : err));
        btn.disabled = false;
        btn.textContent = 'Delete';
      }
    }

    document.getElementById('refresh-btn').addEventListener('click', loadList);
    loadList().catch((err) => {
      console.error(err);
      document.getElementById('list').innerHTML = '<div id="empty">Could not load packages: ' + (err && err.message ? err.message : err) + '</div>';
    });
  </script>
</body>
</html>
