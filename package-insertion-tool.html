<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Itinerary Insertion Tool</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --forest: #2a2421;
            --deep-green: #1d3d2b;
            --gold: #c84b31;
            --cream: #faf8f5;
            --light-border: rgba(42, 36, 33, 0.1);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--cream);
            color: var(--forest);
            min-height: 100vh;
        }

        .header {
            background: linear-gradient(135deg, var(--deep-green), var(--forest));
            color: #fff;
            padding: 48px 0;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        .header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 42px;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .header p {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.8);
            letter-spacing: 1.5px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 48px 20px;
        }

        .form-section {
            background: #fff;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
        }

        .form-section h2 {
            font-family: 'Playfair Display', serif;
            font-size: 24px;
            color: var(--deep-green);
            margin-bottom: 30px;
            font-weight: 500;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .form-row .form-group {
            margin-bottom: 0;
        }

        .form-row-three {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr;
            gap: 16px;
        }

        .form-row-three .form-group {
            margin-bottom: 0;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--forest);
            margin-bottom: 8px;
        }

        input[type="text"],
        input[type="number"],
        select,
        textarea {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--light-border);
            border-radius: 8px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 14px;
            color: var(--forest);
            background: #fafafa;
            transition: all 0.3s;
        }

        input[type="text"]:focus,
        input[type="number"]:focus,
        select:focus,
        textarea:focus {
            outline: none;
            background: #fff;
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(200, 75, 49, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .days-section {
            background: var(--cream);
            padding: 24px;
            border-radius: 12px;
            margin-bottom: 24px;
        }

        .days-section h3 {
            font-family: 'Playfair Display', serif;
            font-size: 18px;
            color: var(--deep-green);
            margin-bottom: 20px;
            font-weight: 500;
        }

        .day-item {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 16px;
            border: 1px solid var(--light-border);
        }

        .day-item h4 {
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--forest);
            margin-bottom: 8px;
        }

        .day-controls {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }

        .day-controls input {
            flex: 1;
        }

        .day-controls button {
            padding: 8px 16px;
            background: var(--gold);
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.3s;
        }

        .day-controls button:hover {
            background: #b83f2a;
        }

        .day-controls .remove-day {
            background: #999;
        }

        .day-controls .remove-day:hover {
            background: #777;
        }

        .add-day-btn {
            background: var(--forest);
            color: #fff;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 1px;
            transition: all 0.3s;
            margin-bottom: 24px;
        }

        .add-day-btn:hover {
            background: var(--deep-green);
        }

        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 32px;
        }

        button[type="button"].primary,
        button[type="submit"] {
            flex: 1;
            padding: 14px 24px;
            border: none;
            border-radius: 8px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s;
        }

        button[type="button"].primary {
            background: var(--forest);
            color: #fff;
            border: 2px solid var(--forest);
        }

        button[type="button"].primary:hover {
            background: transparent;
            color: var(--forest);
        }

        button[type="submit"] {
            background: var(--gold);
            color: #fff;
            border: 2px solid var(--gold);
        }

        button[type="submit"]:hover {
            background: #b83f2a;
            border-color: #b83f2a;
        }

        .preview-section {
            background: #fff;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
            margin-top: 24px;
        }

        .preview-section h2 {
            font-family: 'Playfair Display', serif;
            font-size: 24px;
            color: var(--deep-green);
            margin-bottom: 24px;
            font-weight: 500;
        }

        #preview-area {
            min-height: 500px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--cream);
            border-radius: 16px;
            padding: 24px;
            color: #aaa;
            text-align: center;
        }

        .success-message {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
            padding: 16px;
            border-radius: 8px;
            margin-top: 24px;
            text-align: center;
            display: none;
        }

        .success-message.show {
            display: block;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 28px;
            }

            .form-section {
                padding: 24px;
            }

            .form-row,
            .form-row-three {
                grid-template-columns: 1fr;
            }

            .button-group {
                flex-direction: column;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Itinerary Insertion Tool</h1>
        <p>Create and preview day-by-day itineraries for the brochure</p>
    </div>

    <div class="container">
        <div class="form-section">
            <h2>Itinerary Details</h2>
            <form id="itinerary-form">
                <div class="form-row">
                    <div class="form-group">
                        <label for="country">Country *</label>
                        <select id="country" name="country" required>
                            <option value="">Select a country</option>
                            <option value="Uganda">Uganda, The Pearl of Africa</option>
                            <option value="Algeria">Algeria, Sahara's Best Kept Secret</option>
                            <option value="Rwanda">Rwanda</option>
                            <option value="Tanzania">Tanzania</option>
                            <option value="Kenya">Kenya</option>
                            <option value="Morocco">Morocco</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="package-name">Package Name *</label>
                        <input type="text" id="package-name" name="package-name" placeholder="e.g., Hiking + Safari" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="package-desc">Package Description *</label>
                    <input type="text" id="package-desc" name="package-desc" placeholder="e.g., Mix of wildlife safari and mountain hiking" required>
                </div>

                <div class="form-row-three">
                    <div class="form-group">
                        <label for="nights">Nights *</label>
                        <input type="number" id="nights" name="nights" min="1" max="30" placeholder="5" required>
                    </div>
                    <div class="form-group">
                        <label for="days">Days *</label>
                        <input type="number" id="days" name="days" min="1" max="31" placeholder="6" required>
                    </div>
                </div>

                <div class="days-section">
                    <h3>Day-by-Day Activities</h3>
                    <div id="days-container"></div>
                    <button type="button" class="add-day-btn" id="add-day-btn">+ Add Day</button>
                </div>

                <div class="button-group">
                    <button type="button" class="primary" id="preview-btn">Preview</button>
                    <button type="submit">Submit</button>
                </div>

                <div class="success-message" id="success-message">
                    ✔ Itinerary submitted successfully!
                </div>
            </form>
        </div>

        <div class="preview-section">
            <h2>Live Preview</h2>
            <div id="preview-area">
                <p>Fill in the form and click Preview to see how your itinerary will look</p>
            </div>
        </div>
    </div>

    <script src="package-insertion-tool.js"></script>
</body>
</html>
