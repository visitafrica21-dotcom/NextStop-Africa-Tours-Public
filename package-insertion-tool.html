<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Package Insertion Tool</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --forest: #2a2421;
            --deep-green: #1d3d2b;
            --gold: #c84b31;
            --cream: #faf8f5;
            --light-border: rgba(42, 36, 33, 0.1);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--cream);
            color: var(--forest);
            min-height: 100vh;
        }

        .header {
            background: linear-gradient(135deg, var(--deep-green), var(--forest));
            color: #fff;
            padding: 48px 0;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        .header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 42px;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .header p {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.8);
            letter-spacing: 1.5px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 48px 20px;
        }

        .content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            align-items: start;
        }

        .form-section {
            background: #fff;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
        }

        .form-section h2 {
            font-family: 'Playfair Display', serif;
            font-size: 24px;
            color: var(--deep-green);
            margin-bottom: 30px;
            font-weight: 500;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .form-row .form-group {
            margin-bottom: 0;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--forest);
            margin-bottom: 8px;
        }

        input[type="text"],
        input[type="email"],
        select,
        textarea {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--light-border);
            border-radius: 8px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 14px;
            color: var(--forest);
            background: #fafafa;
            transition: all 0.3s;
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        select:focus,
        textarea:focus {
            outline: none;
            background: #fff;
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(200, 75, 49, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 120px;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 32px;
        }

        button {
            flex: 1;
            padding: 14px 24px;
            border: none;
            border-radius: 8px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s;
        }

        #preview-btn {
            background: var(--forest);
            color: #fff;
            border: 2px solid var(--forest);
        }

        #preview-btn:hover {
            background: transparent;
            color: var(--forest);
        }

        button[type="submit"] {
            background: var(--gold);
            color: #fff;
            border: 2px solid var(--gold);
        }

        button[type="submit"]:hover {
            background: #b83f2a;
            border-color: #b83f2a;
        }

        .preview-section {
            position: sticky;
            top: 48px;
        }

        .preview-section h2 {
            font-family: 'Playfair Display', serif;
            font-size: 24px;
            color: var(--deep-green);
            margin-bottom: 24px;
            font-weight: 500;
        }

        #preview-area {
            min-height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fff;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
            color: #aaa;
            text-align: center;
        }

        .success-message {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
            padding: 16px;
            border-radius: 8px;
            margin-top: 24px;
            text-align: center;
            display: none;
        }

        .success-message.show {
            display: block;
        }

        @media (max-width: 1024px) {
            .content {
                grid-template-columns: 1fr;
            }

            .preview-section {
                position: static;
            }
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 28px;
            }

            .form-section {
                padding: 24px;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .button-group {
                flex-direction: column;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Package Insertion Tool</h1>
        <p>Create and preview new tour packages for the brochure</p>
    </div>

    <div class="container">
        <div class="content">
            <div class="form-section">
                <h2>Package Details</h2>
                <form id="package-form">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="country">Country *</label>
                            <input type="text" id="country" name="country" placeholder="e.g., Kenya, Tanzania" required>
                        </div>
                        <div class="form-group">
                            <label for="tier">Tier *</label>
                            <select id="tier" name="tier" required>
                                <option value="">Select a tier</option>
                                <option value="Economy">Economy</option>
                                <option value="Standard">Standard</option>
                                <option value="Luxury">Luxury</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="name">Package Name *</label>
                        <input type="text" id="name" name="name" placeholder="e.g., Safari Adventure" required>
                    </div>

                    <div class="form-group">
                        <label for="tagline">Tagline</label>
                        <input type="text" id="tagline" name="tagline" placeholder="e.g., Experience the wild like never before">
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="price">Price Range *</label>
                            <input type="text" id="price" name="price" placeholder="e.g., $3,500 - $5,000" required>
                        </div>
                        <div class="form-group">
                            <label for="price-note">Price Note</label>
                            <input type="text" id="price-note" name="price-note" placeholder="e.g., Per person, all-inclusive">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="features">Features (comma-separated) *</label>
                        <textarea id="features" name="features" placeholder="e.g., 5-star accommodations, Guided safari tours, All meals included" required></textarea>
                    </div>

                    <div class="button-group">
                        <button type="button" id="preview-btn">Preview</button>
                        <button type="submit">Submit</button>
                    </div>

                    <div class="success-message" id="success-message">
                        ✔ Package submitted successfully!
                    </div>
                </form>
            </div>

            <div class="preview-section">
                <h2>Live Preview</h2>
                <div id="preview-area">
                    <p>Fill in the form and click Preview to see how your package will look</p>
                </div>
            </div>
        </div>
    </div>

    <script src="package-insertion-tool.js"></script>
</body>
</html>
